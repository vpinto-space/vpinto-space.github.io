# Project details (images, teams, descriptions) live on HelioUSACH; here only MY role.
# Never list projects under evaluation, and never internal grant IDs.

intro: >-
  Estudio cómo el viento solar controla la dinámica de los cinturones de radiación de la Tierra:
  cuándo y por qué los electrones relativistas se aceleran, se transportan o se pierden. Combino
  datos de satélites (Van Allen Probes, THEMIS, GOES) y magnetómetros en tierra con modelos de
  machine learning para predecir perturbaciones geomagnéticas y corrientes inducidas (GIC).
intro_en: >-
  I study how the solar wind controls the dynamics of Earth's radiation belts: when and why
  relativistic electrons are accelerated, transported or lost. I combine satellite data
  (Van Allen Probes, THEMIS, GOES) and ground magnetometers with machine learning models to
  forecast geomagnetic perturbations and geomagnetically induced currents (GIC).

themes:
  - title: Cinturones de radiación y electrones relativistas
    title_en: Radiation belts and relativistic electrons
    text: Aumentos y dropouts en el cinturón externo; formación, confinamiento y decaimiento de cinturones remanentes ultrarelativistas; respuesta radial de los electrones ante perturbaciones geomagnéticas.
    text_en: Enhancements and dropouts in the outer belt; formation, confinement and decay of ultrarelativistic remnant belts; radial response of electrons to geomagnetic disturbances.
  - title: Ondas ULF y turbulencia magnetosférica
    title_en: ULF waves and magnetospheric turbulence
    text: Relación entre la potencia de ondas ULF y los flujos de electrones relativistas; turbulencia y balance de presión en la magnetosfera dinámica.
    text_en: How ULF wave power relates to relativistic electron fluxes; turbulence and pressure balance in the dynamic magnetosphere.
  - title: Machine learning para clima espacial
    title_en: Machine learning for space weather
    text: Predicción de perturbaciones magnéticas en tierra y GIC con redes neuronales profundas, pronóstico probabilístico y técnicas de explicabilidad.
    text_en: Forecasting ground magnetic perturbations and GIC with deep neural networks, probabilistic forecasting and explainability techniques.
  - title: Acoplamiento viento solar–magnetosfera
    title_en: Solar wind–magnetosphere coupling
    text: Influencia del viento solar en la magnetosfera interna y efectos de las tormentas geomagnéticas en la tecnología.
    text_en: Solar wind control of the inner magnetosphere and the effects of geomagnetic storms on technology.

